<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>

  <!-- USB cable (left side) -->
  <rect x="0" y="28" width="18" height="8" rx="2" fill="#333" stroke="#222" stroke-width="1"/>

  <!-- USB Type-B connector body -->
  <rect x="16" y="18" width="32" height="28" rx="3" fill="url(#metalGrad)" stroke="#555" stroke-width="1.5"/>

  <!-- Inner plug (white) -->
  <rect x="22" y="24" width="20" height="16" rx="1" fill="url(#plugGrad)" stroke="#888" stroke-width="0.5"/>

  <!-- USB pins (4 pins visible) -->
  <rect x="25" y="27" width="3" height="10" rx="0.5" fill="#d4af37"/>
  <rect x="30" y="27" width="3" height="10" rx="0.5" fill="#d4af37"/>
  <rect x="35" y="27" width="3" height="10" rx="0.5" fill="#d4af37"/>
  <rect x="40" y="27" width="3" height="10" rx="0.5" fill="#d4af37"/>

  <!-- Power indicator LED -->
  <circle cx="52" cy="22" r="5" fill="#00cc00" opacity="0.9"/>
  <circle cx="52" cy="22" r="3" fill="#66ff66"/>

  <!-- "5V" label -->
  <text x="48" y="48" font-family="monospace" font-size="8" fill="#fff" font-weight="bold">5V</text>

  <!-- Connection line to board (right side) -->
  <rect x="48" y="28" width="16" height="8" rx="2" fill="#444" stroke="#333" stroke-width="1"/>
</svg>
